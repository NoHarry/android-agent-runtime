# The JIT skips one lint (Kotlin UAST) method: on Apple Silicon, JDK 17 builds without JDK-8310844 (JBR 17.0.6/17.0.8)
# crash the daemon in C1 OSR ("Field too big for insn") during lintVitalAnalyzeRelease. Drop it once every JDK in use
# carries that fix.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:CompileCommand=quiet -XX:CompileCommand=exclude,org.jetbrains.uast.kotlin.FirKotlinUastResolveProviderService::resolveSyntheticJavaPropertyAccessorCall
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Coordinates: cc.noharry:<module>:<version>. Releases set VERSION_NAME from the tag.
GROUP=cc.noharry
VERSION_NAME=0.6.0-SNAPSHOT
# The release on Maven Central that the READMEs and the host guide tell a reader to depend on (GuideSnippetsTest).
RELEASED_VERSION=0.5.0
POM_URL=https://github.com/NoHarry/android-agent-runtime
