name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Source rules, API dumps, Android API level checks and lint, unit tests, sample builds
        run: ./gradlew ciCheck --stacktrace
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-*
            **/build/reports/animalsniffer/
          retention-days: 7
      - name: Python tool tests
        working-directory: tools
        run: python3 -m unittest discover -s tests

  published:
    # What an app gets from Maven: the artifacts as published, with their POMs, Gradle metadata and the BOM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to the local Maven repository
        run: ./gradlew publishToMavenLocal --stacktrace
      - name: Build and run the extensions sample against the published artifacts
        run: ./gradlew -PsamplesFromMavenLocal :samples:extensions:test :samples:extensions:run --stacktrace
      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: published-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
