# gitleaks: the default rules, with the made-up credentials of the redaction tests allowed. Each entry names the exact
# fake value, so a real key next to them is still found.
[extend]
useDefault = true

[allowlist]
description = "Fake credentials the runtime's redaction and privacy tests feed in"
regexes = [
  '''sk-(gold|fail|wait)secret123''',
  # The app server's tests: the public keys (never secret) of the example plugin packages, which all start with the
  # fixed header of a P-256 public key.
  '''3059301306072a8648ce3d020106082a8648ce3d030107034200[0-9a-f]+''',
]
