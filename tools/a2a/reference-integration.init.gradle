gradle.afterProject { project, state ->
    if (state.failure == null && project.path == ":agent-a2a-client-direct") {
        def sourceRoot = new File(project.rootProject.projectDir, "tools/a2a/jvm-client/src/test/kotlin")
        project.android.sourceSets.test.java.srcDir(sourceRoot)
        project.tasks.withType(Test).configureEach { task ->
            def baseUrl = gradle.startParameter.systemPropertiesArgs.get("a2a.reference.baseUrl")
            if (baseUrl != null) {
                task.systemProperty("a2a.reference.baseUrl", baseUrl)
            }
        }
    }
}
